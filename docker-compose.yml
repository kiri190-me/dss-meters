# 계측기 관리 시스템 전용 PostgreSQL (개발용).
#
# ⚠️ 반드시 `npm run db:up` 으로 띄운다.
#   docker compose 는 .env 만 자동으로 읽고 .env.local 은 읽지 않는다. 그냥
#   `docker compose up` 을 하면 POSTGRES_PASSWORD 가 빈 값이 되어 컨테이너가
#   재시작 루프에 빠진다. db:up 스크립트가 --env-file .env.local 을 붙인다.
#   (dss-auth 에서 실제로 겪은 함정이라 같은 장치를 둔다.)
#
# 포트가 5438인 이유: 이 개발 PC 에서 A/S 관리 시스템이 5432, dss-auth 가
# 5434, dss-home 이 5436 을 이미 쓴다. 로그인 왕복을 보려면 포털과 이 사이트가
# 동시에 떠 있어야 하므로 겹치면 안 된다.
#
# 운영(NAS Docker)에서는 이 파일을 쓰지 않는다. 개발 PC 전용이다.
#
# 127.0.0.1 에만 바인딩한다 — 개발 PC 밖에서는 직접 접속할 수 없다.
services:
  db-dev:
    image: postgres:16.14-alpine3.24
    container_name: dss-meters-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: dss_meters_app
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: dss_meters_dev
      # 한국어 이름으로 정렬·검색하므로 로케일을 명시한다.
      LANG: ko_KR.UTF-8
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - dss-meters-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_meters_app -d dss_meters_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dss-meters-postgres-dev-data:
    name: dss-meters-postgres-dev-data
